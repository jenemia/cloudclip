# Production: HTTPS via Caddy (automatic Let's Encrypt certificates).
#   1) Point your domain's DNS A/AAAA record to this server, open ports 80 and 443.
#   2) cp .env.example .env  and set DOMAIN / ACME_EMAIL
#   3) docker compose up -d
services:
  cloudclip:
    build: .
    restart: unless-stopped
    environment:
      TRUST_PROXY: "1"
      FORCE_HTTPS: "1"
    expose:
      - "3000"

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      - cloudclip
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
